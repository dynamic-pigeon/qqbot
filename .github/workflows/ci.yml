name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # image_lib 的 opencv crate：构建期要 libclang 探测环境，链接与
      # 测试要系统 OpenCV（ubuntu-24.04 的 libopencv-dev 是 4.6，与
      # README「开发检查」口径一致）
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev libopencv-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --all-targets --locked

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustsec/audit-check 已无人维护且 audit job 持续失败；
      # 直接安装 cargo-audit 运行，与本地 `cargo audit` 口径一致
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit
