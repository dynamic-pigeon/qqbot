<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>每日发言排行 - {{ date }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            padding: 24px;
        }

        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            width: 480px;
            padding: 32px 28px;
            box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            color: #fff;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .header .date {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 6px;
        }

        .rank-item {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 16px;
            margin-bottom: 12px;
            position: relative;
            transition: background 0.2s;
        }

        .rank-item:last-child {
            margin-bottom: 0;
        }

        .rank-1 {
            background: rgba(255, 215, 0, 0.10);
            border: 1px solid rgba(255, 215, 0, 0.25);
        }

        .rank-2 {
            background: rgba(192, 192, 192, 0.08);
            border: 1px solid rgba(192, 192, 192, 0.2);
        }

        .rank-3 {
            background: rgba(205, 127, 50, 0.08);
            border: 1px solid rgba(205, 127, 50, 0.2);
        }

        .rank-badge {
            font-size: 26px;
            width: 32px;
            text-align: center;
            flex-shrink: 0;
            line-height: 1;
        }

        .avatar-wrap {
            flex-shrink: 0;
        }

        .avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            display: block;
        }

        .user-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .nickname {
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .count {
            color: rgba(255, 255, 255, 0.55);
            font-size: 12px;
        }

        .bar-wrap {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            border-radius: 0 0 14px 14px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .bar {
            height: 100%;
            border-radius: 0 0 14px 14px;
            opacity: 0.7;
            transition: width 0.5s ease;
        }

        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <h1>🏆 每日发言排行</h1>
            <div class="date">{{ date }}</div>
        </div>
        {% for item in items %}
        <div class="rank-item rank-{{ item.rank }}">
            <div class="rank-badge" style="color:{{ item.medal_color }};">{{ item.medal }}</div>
            <div class="avatar-wrap">
                <img class="avatar" src="{{ item.avatar_src }}" alt="avatar" />
            </div>
            <div class="user-info">
                <span class="nickname">{{ item.nickname }}</span>
                <span class="count">{{ item.count }} 条消息</span>
            </div>
            <div class="bar-wrap">
                <div class="bar" style="width:{{ item.bar_pct }}%; background:{{ item.medal_color }};"></div>
            </div>
        </div>
        {% endfor %}
        <div class="footer">Top 5 · 数据截至今日</div>
    </div>
</body>

</html>
