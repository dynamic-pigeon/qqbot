<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }} - {{ date }}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                "Microsoft YaHei", "Segoe UI", sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* 截图按 .card 元素截取，外阴影会被裁掉，用细边框提供轮廓。 */
        .card {
            width: 520px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid #e5e7eb;
        }

        .stat-chip {
            background: #f3f4f6;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 12px;
            color: #6b7280;
            white-space: nowrap;
        }

        .stat-chip b {
            color: #111827;
            font-size: 14px;
            margin: 0 3px;
            font-variant-numeric: tabular-nums;
        }

        .title {
            flex: 1;
            min-width: 0;
            text-align: center;
        }

        .title h1 {
            font-size: 17px;
            font-weight: 700;
            color: #111827;
            letter-spacing: 1px;
        }

        .title .date {
            margin-top: 2px;
            font-size: 11px;
            color: #9ca3af;
        }

        .time-label {
            font-size: 11px;
            color: #9ca3af;
            white-space: nowrap;
        }

        /* 固定列宽，超长群昵称只在群友列省略，消息数始终完整可见。 */
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        th {
            padding: 9px 18px;
            font-size: 11px;
            font-weight: 500;
            color: #9ca3af;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            white-space: nowrap;
        }

        td {
            padding: 9px 18px;
            font-size: 14px;
            color: #111827;
            vertical-align: middle;
        }

        th.right,
        td.right {
            text-align: right;
        }

        tbody tr:nth-child(even) {
            background: #f9fafb;
        }

        col.col-rank {
            width: 56px;
        }

        col.col-percent {
            width: 118px;
        }

        col.col-count {
            width: 92px;
        }

        .rank-cell {
            font-weight: 600;
            color: #6b7280;
            font-variant-numeric: tabular-nums;
        }

        tr.r1 .rank-cell {
            color: #f59e0b;
            font-weight: 700;
        }

        tr.r2 .rank-cell {
            color: #9ca3af;
            font-weight: 700;
        }

        tr.r3 .rank-cell {
            color: #a16207;
            font-weight: 700;
        }

        .user-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
            max-width: 100%;
        }

        .user-cell img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .user-cell .name {
            flex: 1;
            min-width: 0;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        td:nth-child(2) {
            overflow: hidden;
        }

        .percent-cell {
            overflow: hidden;
        }

        .percent-inner {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .track {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: #eef0f4;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            min-width: 4px;
            border-radius: 3px;
            background: linear-gradient(90deg, #4a6ee0, #7c9df2);
        }

        .pct {
            width: 36px;
            font-size: 12px;
            color: #6b7280;
            font-variant-numeric: tabular-nums;
            text-align: right;
        }

        .count-cell {
            font-weight: 700;
            font-size: 15px;
            color: #4a6ee0;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
    </style>
</head>

<body>
    <div class="card">
        <div class="header">
            <div class="stat-chip">{{ period }}总计<b>{{ total }}</b>条</div>
            <div class="title">
                <h1>{{ title }}</h1>
                <div class="date">{{ date }}</div>
            </div>
            <div class="time-label">{{ time }}</div>
        </div>
        <table>
            <colgroup>
                <col class="col-rank" />
                <col class="col-user" />
                <col class="col-percent" />
                <col class="col-count" />
            </colgroup>
            <thead>
                <tr>
                    <th>#</th>
                    <th>群友</th>
                    <th class="right">占比</th>
                    <th class="right">消息数</th>
                </tr>
            </thead>
            <tbody>
                {% for item in items %}
                <tr class="r{{ item.rank }}">
                    <td class="rank-cell">{{ item.rank }}</td>
                    <td>
                        <div class="user-cell">
                            <img src="{{ item.avatar_src }}" alt="" />
                            <span class="name">{{ item.nickname }}</span>
                        </div>
                    </td>
                    <td class="percent-cell">
                        <div class="percent-inner">
                            <div class="track">
                                <div class="fill" style="width: {{ item.percent }}%;"></div>
                            </div>
                            <span class="pct">{{ item.percent }}%</span>
                        </div>
                    </td>
                    <td class="count-cell right">{{ item.count }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>

</html>
