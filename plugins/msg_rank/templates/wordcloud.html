<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title }}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0d0d1a 0%, #12122b 50%, #0a1a2f 100%);
            font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
            padding: 40px;
        }

        .card {
            background: rgba(22, 22, 40, 0.95);
            border-radius: 28px;
            box-shadow: 0 32px 80px rgba(0, 0, 0, 0.55);
            padding: 36px;
            text-align: center;
            width: fit-content;
        }

        .card h1 {
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 20px;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .card h1 span {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.55);
            display: block;
            margin-top: 6px;
            font-weight: 400;
            letter-spacing: 0;
        }

        #word-cloud {
            width: 800px;
            height: 800px;
            display: block;
            background: transparent;
        }

        .footer {
            color: rgba(255, 255, 255, 0.45);
            font-size: 12px;
            margin-top: 16px;
        }
    </style>
    {% if has_custom_font %}
    <style>
        @font-face {
            font-family: "CustomWordCloudFont";
            src: url("{{ font_data_url }}");
        }
    </style>
    {% endif %}
</head>

<body>
    <div class="card">
        <h1>{{ title }}<span>msg_rank word cloud</span></h1>
        <canvas id="word-cloud" width="800" height="800"></canvas>
        <div class="footer">Top {{ word_count }} · 由消息统计生成</div>
    </div>
    <script>
        {{ script|safe }}
    </script>
    <script>
        const words = {{ words_json|safe }};
        window.wordcloudWords = words;
        const canvas = document.getElementById('word-cloud');

        function onReady(err) {
            if (err) {
                document.body.setAttribute('data-error', String(err));
            }
            document.body.setAttribute('data-ready', 'true');
        }

        if (words.length === 0) {
            onReady(null);
        } else {
            canvas.addEventListener('wordcloudstop', () => onReady(null), { once: true });
            canvas.addEventListener('wordcloudabort', (evt) => onReady(evt.detail), { once: true });
            WordCloud(canvas, {
                list: words,
                gridSize: 8,
                weightFactor: function (size) {
                    return Math.pow(size, 0.75) * 1.5 + 12;
                },
                fontFamily: {{ font_family|safe }},
                color: function () {
                    const colors = [
                        '#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4',
                        '#FFEAA7', '#DDA0DD', '#87CEEB', '#FF85A2', '#B4E7CE',
                        '#FDCB6E', '#6C5CE7', '#A8E6CF', '#FF7675', '#74B9FF'
                    ];
                    return colors[Math.floor(Math.random() * colors.length)];
                },
                backgroundColor: {{ background|safe }},
                rotateRatio: 0.1,
                minSize: 10,
                shrinkToFit: true,
                drawOutOfBound: false,
                shape: 'square',
                ellipticity: 1.0,
                wait: 0
            });
        }
    </script>
</body>

</html>
