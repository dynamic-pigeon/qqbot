<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<!--
    内容安全策略：默认禁止所有外部资源；只允许页面内联脚本和样式。
    配合后端 HTML sanitize，进一步降低 XSS / SSRF 风险。
    img-src / connect-src 等全部关闭，阻止用户 Markdown 中的图片链接被
    Chromium 加载后发起内网探测或数据外发。font-src 允许 'self' 和 data:
    URI，因为 KaTeX 字体已被构建脚本内联为 data URI。
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'none'; font-src 'self' data:; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none';">
<!-- KaTeX 核心样式 -->
<style>
{{ katex_css|safe }}
</style>
<!-- 自定义数学公式样式 -->
<style>
    .math { margin: 1em 0; }
    .katex { font-size: 1.1em; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
{{ github_md_css|safe }}
.markdown-body {
    box-sizing: border-box;
    width: 100%;
    max-width: 720px;
    margin: 0;
    padding: 12px 12px 20px 12px;
    height: auto;

    font-family: "Noto Sans SC", "MiSans", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
}

body{
    font-family: "Noto Sans SC", "MiSans", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
</style>
<style>
{{ highlight_css|safe }}
</style>
</head>
<body>
<article class="markdown-body">
{{ body|safe }}
</article>
<script>
{{ highlight_js|safe }}
</script>
<script>hljs.highlightAll();</script>
<script>
document.addEventListener('DOMContentLoaded', () => {
    const markdownBody = document.querySelector('.markdown-body');

    // 根据是否有 <pre>/<code> 调整 markdown-body 宽度
    const hasCodeBlock = ['pre', 'code'].some(tag => markdownBody.querySelector(tag));
    markdownBody.style.maxWidth = hasCodeBlock ? '720px' : '500px';

    // 渲染 KaTeX 行内公式
    document.querySelectorAll('.math-inline').forEach(el => {
        const tex = el.textContent;
        const span = document.createElement('span');
        // 解析失败的公式渲染成红色报错文本而非抛异常，否则渲染中断会导致下方的 .finish 标记缺失
        katex.render(tex, span, { displayMode: false, throwOnError: false });
        el.replaceWith(span);
    });
    // 渲染 KaTeX 块级公式
    document.querySelectorAll('.math-display').forEach(el => {
        const tex = el.textContent;
        const div = document.createElement('div');
        katex.render(tex, div, { displayMode: true, throwOnError: false });
        el.replaceWith(div);
    });

    // 完成页面加载的标志
    const finishedElement = document.createElement('div');
    finishedElement.classList.add('finish');
    document.body.appendChild(finishedElement);
});
</script>
<script>
{{ katex_js|safe }}
</script>
</body>
</html>
