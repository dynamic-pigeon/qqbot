<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<!-- KaTeX 核心样式 -->
<style>
{{ katex_css|safe }}
</style>
<!-- 自定义数学公式样式 -->
<style>
    .math { margin: 1em 0; }
    .katex { font-size: 1.1em; }
</style>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
{{ github_md_css|safe }}
.markdown-body {
    box-sizing: border-box;
    width: 100%;
    max-width: 720px;
    margin: 0;
    padding: 12px 12px 20px 12px;
    height: auto;

    font-family: "Noto Sans SC", "MiSans", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
}

body{
    font-family: "Noto Sans SC", "MiSans", "Source Han Sans SC", "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
    margin: 0;
    padding: 0;
    overflow: hidden;
}
</style>
<style>
{{ highlight_css|safe }}
</style>
</head>
<body>
<article class="markdown-body">
{{ body|safe }}
</article>
<script>
{{ highlight_js|safe }}
</script>
<script>hljs.highlightAll();</script>
<script>
const elementsToCheck = ['pre', 'code']; // 需要检测的元素

document.addEventListener("DOMContentLoaded", function() {
    const markdownBody = document.querySelector('.markdown-body');
    let foundElement = false;

    elementsToCheck.forEach(tag => {
        if (markdownBody.querySelector(tag)) {
            foundElement = true;
        }
    });

    if (foundElement) {
        markdownBody.style.maxWidth = '720px';
    } else {
        markdownBody.style.maxWidth = '500px';
    }

    const finishedElement = document.createElement('div');

    finishedElement.classList.add('finish');

    // 完成页面加载
    document.body.appendChild(finishedElement);
});
</script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
    // 渲染行内公式
    document.querySelectorAll('.math-inline').forEach(el => {
        const tex = el.textContent;
        const span = document.createElement('span');
        katex.render(tex, span, { displayMode: false });
        el.replaceWith(span);
    });
    // 渲染块级公式
    document.querySelectorAll('.math-display').forEach(el => {
        const tex = el.textContent;
        const div = document.createElement('div');
        katex.render(tex, div, { displayMode: true });
        el.replaceWith(div);
    });
    });
</script>
<script>
{{ katex_js|safe }}
</script>
</body>
</html>
