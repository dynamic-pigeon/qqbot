[package]
name = "utils"
version = "0.1.0"
edition = "2024"

[features]
default = []
# 启动/关闭 Chromium 进程；截图和 B 站动态后备共用。
chromium = ["dep:chromiumoxide"]
# HTML → PNG，只给真正截图的插件打开，避免其它插件编译截图路径。
screenshot = ["chromium"]
# Markdown → HTML → PNG；在 screenshot 之上再加上解析、消毒和 KaTeX 资源。
markdown = ["screenshot", "dep:pulldown-cmark", "dep:askama", "dep:ammonia"]

[dependencies]
kovi.workspace = true
kovi-onebot.workspace = true
anyhow.workspace = true
arc-swap.workspace = true
serde.workspace = true
sha2.workspace = true
tracing.workspace = true
thiserror.workspace = true
reqwest.workspace = true
ammonia = { workspace = true, optional = true }
askama = { workspace = true, optional = true }
chromiumoxide = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
