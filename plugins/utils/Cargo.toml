[package]
name = "utils"
version = "0.1.0"
edition = "2024"

[features]
default = []
# HTML → PNG，只给真正截图的插件打开，避免其它插件编译 Chromium 客户端。
screenshot = ["dep:chromiumoxide", "dep:futures"]
# Markdown → HTML → PNG；在 screenshot 之上再加上解析、消毒和 KaTeX 资源。
markdown = ["screenshot", "dep:pulldown-cmark", "dep:askama", "dep:ammonia"]

[dependencies]
kovi.workspace = true
kovi-onebot.workspace = true
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
thiserror.workspace = true
arc-swap.workspace = true
reqwest.workspace = true
ammonia = { workspace = true, optional = true }
askama = { workspace = true, optional = true }
chromiumoxide = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
pulldown-cmark = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
