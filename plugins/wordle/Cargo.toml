[package]
name = "wordle"
version = "0.1.0"
edition = "2024"

[features]
default = []
# QQ 插件：kovi 适配层与 PNG 渲染。
qq = [
    "dep:ab_glyph",
    "dep:base64",
    "dep:image",
    "dep:kovi",
    "dep:kovi-onebot",
    "dep:utils",
]
# 独立 CLI 的日志；runtime 用 kovi 再导出的 tokio，和 bot 入口一致。
cli = ["dep:tracing-subscriber", "dep:kovi"]

[dependencies]
anyhow.workspace = true
rand.workspace = true
reqwest.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, optional = true }
ab_glyph = { version = "0.2", optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
kovi = { workspace = true, optional = true }
kovi-onebot = { workspace = true, optional = true }
utils = { workspace = true, optional = true }

[dev-dependencies]
kovi.workspace = true

[lib]
name = "wordle"

[[bin]]
name = "wordle"
path = "src/bin/wordle.rs"
required-features = ["cli"]
