[package]
name = "wordle"
version = "0.1.0"
edition = "2024"

[features]
default = []
# QQ 插件模式：启用 kovi 适配层与 PNG 渲染；CLI 模式不引入这些依赖。
qq = [
    "dep:ab_glyph",
    "dep:base64",
    "dep:image",
    "dep:imageproc",
    "dep:kovi",
    "dep:kovi-onebot",
    "dep:utils",
]
# 独立 CLI 的日志与 runtime；QQ 插件走 kovi 的 runtime，不需要这些。
cli = ["dep:tracing-subscriber", "dep:tokio", "tokio/macros", "tokio/rt"]

[dependencies]
anyhow.workspace = true
rand.workspace = true
reqwest.workspace = true
tracing.workspace = true
tokio = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
ab_glyph = { version = "0.2", optional = true }
base64 = { workspace = true, optional = true }
image = { workspace = true, optional = true }
imageproc = { version = "0.25", optional = true }
kovi = { workspace = true, optional = true }
kovi-onebot = { workspace = true, optional = true }
utils = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lib]
name = "wordle"

[[bin]]
name = "wordle"
path = "src/bin/wordle.rs"
required-features = ["cli"]
