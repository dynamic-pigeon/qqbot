[package]
name = "bot"
version = "0.1.0"
edition = "2024"
authors = ["dynamic-pigeon <3040313336@qq.com>"]
license = "MIT"

[dependencies]
bilibili = { version = "0.1.0", path = "plugins/bilibili" }
help_msg = { version = "0.1.0", path = "plugins/help_msg" }
kovi.workspace = true
kovi-onebot.workspace = true
kovi-plugin-cmd = { version = "0.4.0", features = ["onebot"] }
markdown = { version = "0.1.0", path = "plugins/markdown" }
msg_rank = { version = "0.1.0", path = "plugins/msg_rank" }
yu_gi_oh = { version = "0.1.0", path = "plugins/yu_gi_oh" }
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dotenvy.workspace = true

[workspace]
members = [
    "plugins/help_msg",
    "plugins/markdown",
    "plugins/yu_gi_oh",
    "plugins/utils",
    "plugins/msg_rank",
    "plugins/bilibili",
]

[workspace.dependencies]
playwright-rs = { version = "0.14", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "macros",
] }
help_msg = { path = "plugins/help_msg" }
kovi = "0.13.4"
kovi-onebot = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "rustls"] }
utils = { path = "plugins/utils" }
base64 = "0.22"
bytes = "1"
askama = "0.16"
moka = { version = "0.12", features = ["future"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls-ring-webpki", "sqlite"] }
futures = "0.3"
itertools = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "ansi",
] }
tracing-appender = "0.2"
arc-swap = "1"
thiserror = "2"
dotenvy = "0.15"
pulldown-cmark = "0.13"
crossbeam-epoch = "0.9"
regex = "1"
urlencoding = "2"
libc = "0.2"
