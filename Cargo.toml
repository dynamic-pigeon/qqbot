[package]
name = "bot"
version = "0.1.0"
edition = "2024"

[dependencies]
help_msg = { version = "0.1.0", path = "plugins/help_msg" }
kovi = "0.12.6"
kovi-plugin-cmd = "0.3.0"
markdown = { version = "0.1.0", path = "plugins/markdown" }
word_cloud = { version = "0.1.0", path = "plugins/word_cloud" }

[workspace]
members = [
    "plugins/help_msg",
    "plugins/markdown",
    "plugins/word_cloud",
    "utils",
]

[workspace.dependencies]
help_msg = { path = "plugins/help_msg" }
kovi = "0.12.6"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "rustls"] }
utils = { path = "utils" }
