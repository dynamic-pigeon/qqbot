[package]
name = "bot"
version = "0.1.0"
edition = "2024"
authors = ["dynamic-pigeon <3040313336@qq.com>"]
license = "MIT"

[features]
default = []
# 全局分配器二选一（互斥，同时开启会编译报错）。
# musl 默认分配器几乎不归还内存，词云/截图等大分配后 RSS 会一直停在高水位；
# jemalloc 碎片控制好，mimalloc 构建更轻、归还同样积极。
# 部署 Linux 时建议开启其一：
#   cargo zigbuild --target x86_64-unknown-linux-musl --release --features jemalloc
jemalloc = ["dep:tikv-jemallocator"]
mimalloc = ["dep:mimalloc"]

[dependencies]
bilibili = { version = "0.1.0", path = "plugins/bilibili" }
help_msg = { version = "0.1.0", path = "plugins/help_msg" }
image_lib = { version = "0.1.0", path = "plugins/image_lib" }
kovi.workspace = true
kovi-onebot.workspace = true
kovi-plugin-cmd = { version = "0.4.0", features = ["onebot"] }
markdown = { version = "0.1.0", path = "plugins/markdown" }
msg_rank = { version = "0.1.0", path = "plugins/msg_rank" }
utils.workspace = true
wordle = { version = "0.1.0", path = "plugins/wordle", features = ["qq"] }
yu_gi_oh = { version = "0.1.0", path = "plugins/yu_gi_oh" }
tracing-subscriber.workspace = true
tracing-appender.workspace = true
dotenvy.workspace = true
tracing.workspace = true
tikv-jemallocator = { version = "0.7", optional = true }
mimalloc = { version = "0.1", optional = true }

[dev-dependencies]
kovi.workspace = true
kovi-onebot.workspace = true
tokio-tungstenite = "0.30"
utils.workspace = true

[workspace]
members = [
    "plugins/help_msg",
    "plugins/markdown",
    "plugins/yu_gi_oh",
    "plugins/utils",
    "plugins/msg_rank",
    "plugins/bilibili",
    "plugins/wordle",
    "plugins/image_lib",
]

[workspace.dependencies]
help_msg = { path = "plugins/help_msg" }
kovi = "0.13.5"
kovi-onebot = "0.13.2"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
reqwest = { version = "0.13", features = ["json", "rustls"] }
utils = { path = "plugins/utils" }
base64 = "0.23"
bytes = "1"
askama = "0.16"
moka = { version = "0.12", features = ["future"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "fmt",
    "ansi",
] }
tracing-appender = "0.2"
arc-swap = "1"
thiserror = "2"
dotenvy = "0.15"
pulldown-cmark = "0.13"
regex = "1"
urlencoding = "2"

ammonia = "4"
chromiumoxide = "0.9"
hmac = "0.13"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
jieba-rs = "0.10"
md-5 = "0.11"
rand = "0.10"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt"] }
wordcloud = { git = "https://github.com/dynamic-pigeon/wordcloud-rs" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
